{% extends 'admin_panel/admin_base.html' %}
{% load static %}

{% block admin_css %}
<link rel="stylesheet" href="{% static 'css/admin/category.css' %}">
{% endblock %}

{% block admin_content %}
<form action="{% url 'add_category' %}" method="POST">
    {% csrf_token %}
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <p class="text-muted text-uppercase mb-1" style="font-size: 0.7rem; font-weight: 700; letter-spacing: 1px;">Catalog Architecture</p>
            <h2 class="admin-page-title mb-0">Add Category</h2>
        </div>
        <div class="d-flex align-items-center gap-3">
            <a href="{% url 'category_management' %}" class="btn btn-light text-dark fw-bold px-4 py-2" style="font-size: 0.85rem;">Cancel</a>
            <button type="submit" class="btn btn-save-category shadow-sm">
                <i class="bi bi-plus-lg me-1"></i> Save Category
            </button>
        </div>
    </div>

    <div class="row">
        <div class="col-xl-9 col-lg-12">
            <div class="admin-card">
                
                <div class="mb-4">
                    <label class="custom-label">CATEGORY NAME</label>
                    <input type="text" name="category_name" id="categoryNameInput" class="form-control custom-input" placeholder="e.g. Artisanal Cheeses" required>
                </div>

                <div class="mb-4">
                    <label class="custom-label">URL SLUG</label>
                    <input type="text" name="slug" id="slugInput" class="form-control custom-input mb-1" placeholder="e.g. artisanal-cheeses">
                    <small class="text-muted" style="font-size: 0.75rem;">Auto-generated from the name.</small>
                </div>

                <div class="mb-1">
                    <label class="custom-label">DESCRIPTION</label>
                    <textarea name="description" class="form-control custom-input" rows="6" placeholder="Describe the category..."></textarea>
                </div>
                
            </div>
        </div>
    </div>
</form>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const nameInput = document.getElementById("categoryNameInput");
        const slugInput = document.getElementById("slugInput");

        if(nameInput && slugInput) {
            nameInput.addEventListener("input", function() {
                // Get the value of the name input
                let title = nameInput.value;
                
                // Convert to slug format (lowercase, replace spaces with hyphens, remove special characters)
                let slug = title.toLowerCase().trim()
                    .replace(/[^a-z0-9 -]/g, '') // remove invalid chars
                    .replace(/\s+/g, '-')        // collapse whitespace and replace by -
                    .replace(/-+/g, '-');        // collapse dashes

                // Instantly update the slug input box
                slugInput.value = slug;
            });
        }
    });
</script>
{% endblock %}
