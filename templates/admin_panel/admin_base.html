{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Foodifly Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Global CSS that applies to ALL admin pages -->
    <link rel="stylesheet" href="{% static 'css/admin/admin_dashboard.css' %}">
    
    <!-- It's best practice to let child pages load their own CSS, 
         but I've left these here so nothing else breaks on your other pages! -->
    <link rel="stylesheet" href="{% static 'css/admin/category.css' %}">
    <link rel="stylesheet" href="{% static 'css/admin/add_category.css' %}">
    <link rel="stylesheet" href="{% static 'css/admin/product.css' %}">

    <!-- 1. ADDED: This allows add_product.html to inject its specific CSS -->
    {% block admin_css %}{% endblock %}

</head>
<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            {% include 'includes/admin/sidebar.html' %}

            <main class="col-lg-10">
                {% include 'includes/admin/navbar.html' %}

                <div class="p-4">
                    {% block admin_content %}{% endblock %}
                </div>
            </main>
        </div>
    </div>

    <!-- Bootstrap JS (Required for the Cropper Modal to open) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 2. ADDED: This allows add_product.html to inject its specific JavaScript -->
    {% block admin_js %}{% endblock %}
</body>
</html>
