{% load static %}
<!DOCTYPE html>
<html lang="en">
<!-- BOOTSTRAP -->

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<!-- BOOTSTRAP ICONS -->

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
>

<!-- GOOGLE FONT -->

<link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
>

<!-- GLOBAL ADMIN CSS -->

<link
    rel="stylesheet"
    href="{% static 'css/admin/admin_base.css' %}"
>
{% load static %}

<link rel="icon" href="{% static 'images/favicon.ico' %}" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon-32x32.png' %}">
<link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/favicon-16x16.png' %}">
<link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/apple-touch-icon.png' %}">
<link rel="manifest" href="{% static 'images/site.webmanifest' %}">

<!-- PAGE SPECIFIC CSS -->

{% block admin_css %}

{% endblock %}
<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            {% include 'includes/admin/sidebar.html' %}

            <main class="col-lg-10">
                {% include 'includes/admin/navbar.html' %}

                <div class="p-4">
                    {% block admin_content %}{% endblock %}
                </div>
            </main>
        </div>
    </div>

    <!-- Bootstrap JS (Required for the Cropper Modal to open) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 2. ADDED: This allows add_product.html to inject its specific JavaScript -->
    {% block admin_js %}
   
    {% endblock %}
</body>
</html>
