{% extends 'accounts/dashboard_base.html' %}
{% load static %}

{% block dashboard_css %}
<link rel="stylesheet" href="{% static 'css/add_address.css' %}">
{% endblock %}

{% block dashboard_content %}
{% include "includes/alerts.html" %}
<h1 class="settings-page-title mb-2">Edit Addresses</h1>

<div class="row">
    <div class="col-xl-10 col-lg-12">
        <div class="address-form-card shadow-sm">
            <form
    method="POST"
    action="{% url 'edit_address' address.id %}?next={{ request.GET.next }}">
                {% csrf_token %}
                <input
    type="hidden"
    name="next"
    value="{{ request.GET.next }}"
>
                
                <div class="row g-2">
                    
                    <div class="col-md-6">
                        <label class="custom-label">FIRST NAME</label>
                        <input type="text" name="first_name" class="form-control custom-input" value="{{ address.first_name }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="custom-label">LAST NAME</label>
                        <input type="text" name="last_name" class="form-control custom-input" value="{{ address.last_name }}" required>
                    </div>

                    <div class="col-12">
                        <label class="custom-label">ADDRESS</label>
                        <input type="text" name="address_line_1" class="form-control custom-input" value="{{ address.address_line_1 }}" required>
                    </div>

                    <div class="col-md-4">
                        <label class="custom-label">CITY</label>
                        <input type="text" name="city" class="form-control custom-input" value="{{ address.city }}" required>
                    </div>
                    <div class="col-md-4">

    <label class="custom-label">

        DISTRICT

    </label>

    <input
        type="text"
        name="district"
        class="form-control custom-input"
        value="{{ address.district }}"
        required
    >

</div>
                    <div class="col-md-4">
                        <label class="custom-label">STATE</label>
                        <input type="text" name="state" class="form-control custom-input" value="{{ address.state }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="custom-label">POSTAL CODE</label>
                        <input type="text" name="postal_code" class="form-control custom-input" value="{{ address.postal_code }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="custom-label">PHONE NUMBER</label>
                        <input type="text" name="phone" class="form-control custom-input" value="{{ address.phone }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="custom-label">COUNTRY</label>
                        <select name="country" class="form-select custom-input" required>
                            <option value="IN" {% if address.country == 'IN' %}selected{% endif %}>India</option>
                            <option value="US" {% if address.country == 'US' %}selected{% endif %}>United States</option>
                            <option value="IT" {% if address.country == 'IT' %}selected{% endif %}>Italy</option>
                            <option value="UK" {% if address.country == 'UK' %}selected{% endif %}>United Kingdom</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top-faint">
                    <div class="form-check custom-checkbox-wrapper mb-0">
                        <input class="form-check-input custom-checkbox" type="checkbox" name="is_default" id="defaultAddress" {% if address.is_default %}checked{% endif %}>
                        <label class="form-check-label text-muted" for="defaultAddress" style="font-size: 0.75rem; font-weight: 500;">
                            Set as default delivery address
                        </label>
                    </div>

                    <div class="d-flex align-items-center gap-3">
                        <a href="{% url 'address' %}" class="btn-cancel text-uppercase">Cancel</a>
                        <button type="submit" class="btn-save-address shadow-sm">
                            <i class="bi bi-pencil-square me-1"></i> UPDATE ADDRESS
                        </button>
                    </div>
                </div>

            </form>
        </div>
    </div>
</div>
{% endblock %}
