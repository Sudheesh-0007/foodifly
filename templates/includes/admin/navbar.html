{% load static %}
<div class="admin-top-bar d-flex justify-content-between align-items-center p-4 bg-white border-bottom">
    <div class="search-wrapper w-50">
        <div class="input-group">
            <span class="input-group-text bg-light border-0"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control bg-light border-0" placeholder="Search products, orders...">
        </div>
    </div>
    <div class="admin-profile d-flex align-items-center">
        <div class="text-end me-3">
            <p class="m-0 fw-bold">{{ user.username|default:"Admin User" }}</p>
            <small class="text-muted">SENIOR CURATOR</small>
        </div>
       
    </div>
</div>
