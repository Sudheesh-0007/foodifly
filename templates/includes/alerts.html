{% if messages %}
    <div class="messages-container" style="max-width: 600px; margin: 0 auto;">
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm text-center" role="alert" style="border-radius: 6px; font-family: 'Inter', sans-serif;">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    </div>


{% endif %}
{% if user_form.errors %}
    <div class="messages-container" style="max-width: 600px; margin: 0 auto;">
        <div class="alert alert-danger text-center shadow-sm">
            {% for field in user_form %}
                {% for error in field.errors %}
                    <div>{{ error }}</div>
                {% endfor %}
            {% endfor %}
        </div>
    </div>
{% endif %}

    <script>
        setTimeout(function() {
            var alerts = document.querySelectorAll('.alert');
            alerts.forEach(function(alert) {
                alert.classList.remove('show');
                setTimeout(() => alert.remove(), 150); // Removes from DOM after fade transition
            });
        }, 4000); 
    </script>
