{% if messages %}
    <div class="messages-container" style="max-width: 600px; margin: 0 auto;">
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm text-center" role="alert" style="border-radius: 6px; font-family: 'Inter', sans-serif;">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    </div>

    <script>
        setTimeout(function() {
            var alerts = document.querySelectorAll('.alert');
            alerts.forEach(function(alert) {
                alert.classList.remove('show');
                setTimeout(() => alert.remove(), 150); // Removes from DOM after fade transition
            });
        }, 4000); 
    </script>
{% endif %}
